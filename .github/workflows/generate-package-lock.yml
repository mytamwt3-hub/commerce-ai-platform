name: Generate package-lock

on:
  push:
    branches: [ chore/generate-package-lock ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (generate lockfile)
        run: |
          npm install

      - name: Commit package-lock.json if changed
        run: |
          if [ -f package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: add package-lock generated by workflow"
              git push origin HEAD:chore/generate-package-lock
            else
              echo "No changes to commit"
            fi
          else
            echo "package-lock.json not generated"
          fi
